<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Daylight — Passport</title>
<style>
:root{--violet:#5B3FA0;--amber:#FFB23E;--ink:#211C33;--muted:#6E6880;--faint:#9A95AD;--bg:#F6F5FB;--paper:#FFFFFF;--line:#ECEAF4;--inset:#F3F1FA;--green:#1FAA6B;--greenSoft:#E6F6EE;--serif:'Urbanist',system-ui,sans-serif;--body:'Jost',system-ui,sans-serif;--kh:'Noto Sans Khmer',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:var(--body);display:flex;justify-content:center;align-items:center;padding:20px;background:#E9E7F2}
.phone{width:375px;height:812px;background:var(--paper);border-radius:50px;padding:12px;box-shadow:0 26px 60px rgba(40,30,80,.18)}
.screen{background:var(--bg);border-radius:38px;overflow:hidden;height:100%;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 2px;font-family:var(--body);font-weight:700;font-size:13px;color:var(--ink)}
.status .dots{display:flex;gap:4px}.status .dots span{width:5px;height:5px;border-radius:50%;background:var(--ink)}
.header{display:flex;align-items:center;gap:12px;padding:8px 22px 10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--violet);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(91,63,160,.35)}
.logo svg{width:20px;height:20px}
.logotxt{font-family:var(--serif);font-weight:800;font-size:17px;color:var(--ink)}
.bell{margin-left:auto;width:38px;height:38px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.bell svg{width:18px;height:18px}
.scroll{flex:1;overflow:hidden;padding:4px 18px 8px;display:flex;flex-direction:column;gap:10px}
.ident{background:linear-gradient(150deg,#5B3FA0,#6E4FB8);border-radius:20px;padding:15px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 26px rgba(91,63,160,.28)}
.idtop{display:flex;align-items:center;gap:14px}
.avatar{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.avatar svg{width:30px;height:30px}
.idname{font-family:var(--serif);font-weight:800;font-size:21px;color:#fff}.idrole{font-family:var(--body);font-weight:600;font-size:13px;color:rgba(255,255,255,.82)}
.idpill{margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);color:#fff;font-family:var(--body);font-weight:800;font-size:10px}.idpill svg{width:12px;height:12px}
.idrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--body);font-weight:600;font-size:12.5px;color:rgba(255,255,255,.9)}
.idmeta{display:flex;align-items:center;gap:6px;font-family:var(--body);font-weight:600;font-size:11.5px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.12);border-radius:11px;padding:8px 11px}.idmeta svg{flex:0 0 auto}
.readiness{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(40,30,80,.05)}
.readl{font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.readv{font-family:var(--serif);font-weight:800;font-size:19px;color:var(--ink);margin:4px 0 11px}
.track{height:10px;background:var(--inset);border-radius:999px;overflow:hidden}.fill{height:100%;width:72%;background:linear-gradient(90deg,var(--violet),#8A6BC8);border-radius:999px}
.skills{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(40,30,80,.05)}
.sect{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:11px}
.skill{display:inline-flex;align-items:center;gap:6px;margin:0 8px 8px 0;font-family:var(--body);font-weight:700;font-size:12.5px;color:var(--green);background:var(--greenSoft);border:1px solid #BDEAD4;border-radius:999px;padding:7px 11px}.skill svg{width:13px;height:13px}
.skill.off{color:var(--muted);background:var(--inset);border-color:var(--line)}
.sharebtn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--violet);color:#fff;border-radius:16px;padding:14px;font-family:var(--body);font-weight:800;font-size:15px;box-shadow:0 8px 20px rgba(91,63,160,.32)}.sharebtn svg{width:18px;height:18px}
.tabbar{background:var(--paper);border-top:1px solid var(--line);height:80px;border-radius:0 0 38px 38px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;position:relative}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint);font-family:var(--body);font-weight:700;font-size:10px;padding:10px 0;width:64px}
.tab svg{width:24px;height:24px}
.tab svg path,.tab svg rect,.tab svg circle,.tab svg polygon{fill:var(--faint);stroke:none}
.tab.on{color:var(--violet)}.tab.on svg path,.tab.on svg rect,.tab.on svg circle,.tab.on svg polygon{fill:var(--violet)}
.tab.on::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:3px;background:var(--violet)}
svg path{stroke-linejoin:round}
</style><script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>

<div class="bell"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z" fill="#6E6880"/><path d="M10 19a2 2 0 004 0" fill="none" stroke="#6E6880" stroke-width="2" stroke-linecap="round"/></svg></div></div>
<div class="scroll">

<span class="skill"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#1FAA6B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Machine sewing</span>
<span class="skill"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#1FAA6B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>QC inspection</span>
<span class="skill"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#1FAA6B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Packaging</span>
<span class="skill off">Forklift license</span><span class="skill off">English B1</span></div>

</div>
<div class="tabbar"><div class="tab"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="8" width="16" height="12" rx="2.5"/><path d="M9 8V6.5a2 2 0 012-2h2a2 2 0 012 2V8"/><path d="M4 13h16"/></svg>Jobs</div>
<div class="tab"><svg viewBox="0 0 24 24" fill="none"><rect x="6" y="4" width="12" height="16" rx="2.5"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>Applications</div>
<div class="tab on"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 2.5v5.2c0 4.3-3 7.4-7 9.5-4-2.1-7-5.2-7-9.5V5.5z"/><circle cx="12" cy="11" r="2.2"/></svg>Passport</div>
<div class="tab"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-6 8 6"/><path d="M6 10.5V19a1 1 0 001 1h10a1 1 0 001-1v-8.5"/></svg>Help</div></div>
</div></div></body></html>
