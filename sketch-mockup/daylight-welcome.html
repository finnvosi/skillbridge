<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Daylight — Welcome</title>
<style>
:root{--violet:#5B3FA0;--violetDeep:#4A2F8A;--amber:#FFB23E;--ink:#211C33;--muted:#6E6880;--bg:#F6F5FB;--paper:#FFFFFF;--green:#1FAA6B;--serif:'Urbanist',system-ui,sans-serif;--body:'Jost',system-ui,sans-serif;--kh:'Noto Sans Khmer',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:var(--body);display:flex;justify-content:center;align-items:center;padding:20px;background:#E9E7F2}
.phone{width:375px;height:812px;background:var(--paper);border-radius:50px;padding:12px;box-shadow:0 26px 60px rgba(40,30,80,.18)}
.screen{border-radius:38px;overflow:hidden;height:100%;display:flex;flex-direction:column}
.welcome{background:linear-gradient(160deg,#5B3FA0 0%,#6E4FB8 55%,#8A6BC8 100%);flex:1;display:flex;flex-direction:column;padding:0 26px 30px;color:#fff}
.wbrand{display:flex;align-items:center;gap:10px;padding:20px 0 10px}
.wlogo{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.wlogo svg{width:22px;height:22px}
.wtxt{font-family:var(--serif);font-weight:800;font-size:18px}
.whero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.wbadge{align-self:flex-start;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 13px;font-weight:700;font-size:12px}
.whead{font-family:var(--serif);font-weight:800;font-size:34px;line-height:1.08;letter-spacing:-.02em}
.wsub{font-size:15px;line-height:1.5;color:rgba(255,255,255,.82);max-width:280px}
.wlang{display:flex;gap:8px;margin-top:4px}
.wlang button{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:13px;padding:13px;font-family:var(--body);font-weight:700;font-size:14px;color:#fff}
.wlang button.on{background:#fff;color:var(--violetDeep)}
.wcta{margin-top:20px;background:var(--amber);color:#3A2402;border-radius:16px;padding:17px;text-align:center;font-family:var(--body);font-weight:800;font-size:16px;box-shadow:0 10px 26px rgba(255,178,62,.45)}
.wtiny{text-align:center;font-size:11px;color:rgba(255,255,255,.6);margin-top:12px}
</style><script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body><div class="phone"><div class="screen"><div class="welcome">
<div class="wbrand"><div class="wlogo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3z" fill="#fff"/></svg></div><div class="wtxt">SkillBridge</div></div>
<div class="whero">
<div class="wbadge">🌍 Cambodia · ខ្មែរ</div>
<div class="whead">Find work you can trust.</div>
<div class="wsub">Verified jobs. A passport of your real skills. One tap to apply — no stress.</div>
<div class="wlang"><button class="on">ខ្មែរ</button><button>English</button></div>
</div>
<div><div class="wcta">Get started</div><div class="wtiny">By continuing you agree to honest, scam-free listings.</div></div>
</div></div></div></body></html>
